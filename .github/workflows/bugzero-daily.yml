name: Bug Zero Daily Dashboard

on:
  workflow_dispatch:
  schedule:
    # 04:30 IST daily
    - cron: '0 23 * * *'

jobs:
  run-bugzero-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELVIS_DB_HOST: ${{ secrets.ELVIS_DB_HOST }}
      ELVIS_DB_USER: ${{ secrets.ELVIS_DB_USER }}
      ELVIS_DB_PASSWORD: ${{ secrets.ELVIS_DB_PASSWORD }}
      ELVIS_DB_NAME: ${{ secrets.ELVIS_DB_NAME }}
      ELVIS_DB_PORT: ${{ secrets.ELVIS_DB_PORT }}
      BUGZERO_TO: ${{ secrets.BUGZERO_TO }}
      BUGZERO_EMAIL_BACKEND: smtp
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
      BUGZERO_REPORTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python python-dotenv

      - name: Run Bug Zero dashboard script
        shell: bash
        run: |
          python scripts/bug_zero_dashboard_email.py

      - name: Upload generated dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugzero-dashboard-${{ github.run_number }}
          path: artifacts/DA28_BugZero_Dashboard_*.html
          if-no-files-found: warn
