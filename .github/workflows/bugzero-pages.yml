name: Bug Zero Pages Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bugzero-pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELVIS_DB_HOST: ${{ secrets.ELVIS_DB_HOST }}
      ELVIS_DB_USER: ${{ secrets.ELVIS_DB_USER }}
      ELVIS_DB_PASSWORD: ${{ secrets.ELVIS_DB_PASSWORD }}
      ELVIS_DB_NAME: ${{ secrets.ELVIS_DB_NAME }}
      ELVIS_DB_PORT: ${{ secrets.ELVIS_DB_PORT }}
      BUGZERO_PAGES_DIR: ${{ github.workspace }}/pages-dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python python-dotenv

      - name: Build dashboard site
        run: python scripts/publish_dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
